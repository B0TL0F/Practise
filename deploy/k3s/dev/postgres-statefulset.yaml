apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: ledgerlab-dev
spec:
  # Use the headless Service for stable pod DNS.
  serviceName: postgres
  # Run one PostgreSQL instance for DEV.
  replicas: 1
  # The selector must match the pod template label below.
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        # The PostgreSQL Service uses this label to find the pod.
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17
          ports:
            # The Service's named target port refers to this port.
            - name: postgres
              containerPort: 5432
          env:
            # Set the database name and user when initializing an empty volume.
            - name: POSTGRES_DB
              value: bankinglab
            - name: POSTGRES_USER
              value: bankinglab
            # Read the password from the postgres-auth Secret in ledgerlab-dev.
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-auth
                  key: password
            # Keep the database files in a subdirectory of the mounted volume.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          # Mark the pod Ready when PostgreSQL accepts TCP connections.
          readinessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", "bankinglab", "-d", "bankinglab"]
          # Mount the persistent claim named data at the PostgreSQL data directory.
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  # Create a persistent claim per replica. postgres-0 reuses data-postgres-0.
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        # Store the database on the K3s node's disk.
        storageClassName: local-path
        # Allow read-write mounting by one node at a time.
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
