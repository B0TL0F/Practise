apiVersion: apps/v1
kind: Deployment
metadata:
  name: transactions-service
  namespace: ledgerlab-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: transactions-service
  template:
    metadata:
      labels:
        app: transactions-service
    spec:
      # Authenticate to ACR with the namespace's pull-only credentials.
      imagePullSecrets:
        - name: acr-pull
      containers:
        - name: transactions-service
          # Verify this commit's image tag exists in ACR before rollout.
          image: bankingshubham01.azurecr.io/transactions-service:d6236546c16c0a4b43e9b624c0b44fd495af8d25
          ports:
            - name: http
              containerPort: 8080
          env:
            # Use the payments Service DNS name inside ledgerlab-dev.
            - name: PAYMENTS_URL
              value: http://payments-service:8080
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
