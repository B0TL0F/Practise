apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: azure-keyvault
  namespace: ledgerlab-dev
spec:
  provider:
    azurekv:
      # Authenticate as the VM's system-assigned managed identity, so no password is stored.
      authType: ManagedIdentity
      vaultUrl: https://kv-ledgerlab-shubham.vault.azure.net/
