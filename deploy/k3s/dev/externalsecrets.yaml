# External Secrets Operator copies these values from Azure Key Vault into Kubernetes Secrets.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-auth
  namespace: ledgerlab-dev
spec:
  # Re-read the vault every hour so rotated values reach the cluster.
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: azure-keyvault
  target:
    # The Secret name that postgres and payments-service already reference.
    name: postgres-auth
  data:
    - secretKey: password
      remoteRef:
        key: postgres-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: acr-pull
  namespace: ledgerlab-dev
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: azure-keyvault
  target:
    # The imagePullSecrets name used by every Deployment.
    name: acr-pull
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"bankingshubham01.azurecr.io":{"username":"{{ .username }}","password":"{{ .password }}","auth":"{{ printf "%s:%s" .username .password | b64enc }}"}}}'
  data:
    - secretKey: username
      remoteRef:
        key: acr-pull-username
    - secretKey: password
      remoteRef:
        key: acr-pull-password
