apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-ui
  namespace: ledgerlab-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-ui
  template:
    metadata:
      labels:
        app: web-ui
    spec:
      # Authenticate to ACR with the namespace's pull-only credentials.
      imagePullSecrets:
        - name: acr-pull
      containers:
        - name: web-ui
          # Verify this commit's image tag exists in ACR before rollout.
          image: bankingshubham01.azurecr.io/web-ui:3ad4f2adc3eee745cf3bcc51cc710fd6fe639ac3
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
