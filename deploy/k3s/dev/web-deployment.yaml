apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-ui
  namespace: ledgerlab-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-ui
  template:
    metadata:
      labels:
        app: web-ui
    spec:
      # Authenticate to ACR with the namespace's pull-only credentials.
      imagePullSecrets:
        - name: acr-pull
      containers:
        - name: web-ui
          # Verify this commit's image tag exists in ACR before rollout.
          image: bankingbotlofacr.azurecr.io/web-ui:ecdeb3f8a423d0397af6e0dc06d4718d63de3813
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
