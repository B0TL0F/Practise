apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-ui
  namespace: ledgerlab-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-ui
  template:
    metadata:
      labels:
        app: web-ui
    spec:
      # Authenticate to ACR with the namespace's pull-only credentials.
      imagePullSecrets:
        - name: acr-pull
      containers:
        - name: web-ui
          # Verify this commit's image tag exists in ACR before rollout.
          image: bankingshubham01.azurecr.io/web-ui:9d2e29091d30e8ec4f6e2594d9dd55bb0cdc6d26
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
