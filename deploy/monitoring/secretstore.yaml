apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: azure-keyvault
  namespace: monitoring
spec:
  provider:
    azurekv:
      # Authenticate as the VM's system-assigned managed identity.
      authType: ManagedIdentity
      vaultUrl: https://kv-ledgerlab-shubham.vault.azure.net/
