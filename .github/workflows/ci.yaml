name: CI
on:
    push:
        branches:
        - main
        paths-ignore:
        - '.github/workflows/**'
    pull_request:

permissions:
    contents: read
    id-token: write
    actions: write

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v3
            - uses: actions/setup-node@v3
              with:
                  node-version: 20
                  cache: 'yarn'
            - run: yarn install --frozen-lockfile
            - run: yarn build