name: Build
on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        context:
        - ./services/accounts-service
        - ./services/payments-service
        - ./services/transactions-service
        - ./web-ui
    runs-on: ubuntu-24.04
    steps:
        - name: Checkout
          uses: actions/checkout@v6.1.0
        - name: Build Docker images
          uses: docker/build-push-action@v7.4.0
          with:
            context: ${{ matrix.context }}
